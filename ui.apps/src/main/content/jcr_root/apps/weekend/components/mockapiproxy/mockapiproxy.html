<!-- Load Clientlib CSS and JS -->
<sly data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html">
    <sly data-sly-call="${clientlib.all @ categories='weekend.components.mockapiproxy'}" />
</sly>

<div class="mock-api-proxy-container" data-resource-path="${resource.path}">
    <!-- Header Banner -->
    <div class="mock-api-proxy-header-section">
        <h2>${properties.title || 'User Directory (Servlet Proxy)'}</h2>
        <span class="mock-api-proxy-source-badge">Source API: ${properties.apiEndpoint || 'https://jsonplaceholder.typicode.com/users'}</span>
    </div>

    <!-- Local Search Bar -->
    <div class="mock-api-proxy-search-wrapper">
        <input type="text" class="mock-api-proxy-search-input" placeholder="Search profiles dynamically..." />
        <span class="mock-api-proxy-search-icon">🔍</span>
    </div>

    <!-- Error Alert Box -->
    <div class="mock-api-proxy-error-alert" style="display: none;">
        <strong>Proxy Servlet Error:</strong> <span class="error-message-text"></span>
    </div>

    <!-- Dynamic Cards Grid -->
    <div class="mock-api-proxy-grid">
        <!-- Spinner Loader -->
        <div class="mock-api-proxy-loader">
            <div class="spinner"></div>
            <p>Requesting profile data from OSGi Servlet...</p>
        </div>
    </div>

    <!-- No results screen -->
    <div class="mock-api-proxy-no-results" style="display: none;">
        <p>No profiles match your search criteria.</p>
    </div>
</div>
